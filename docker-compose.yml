name: onetake

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onetake}
      POSTGRES_USER: ${POSTGRES_USER:-onetake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onetake_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onetake} -d ${POSTGRES_DB:-onetake}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: docker.1panel.live/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onetake}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-onetake_dev_password}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: docker.1panel.live/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-onetake} $${MINIO_ROOT_PASSWORD:-onetake_dev_password};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-onetake-media};
      mc anonymous set private local/$${MINIO_BUCKET:-onetake-media};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onetake}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-onetake_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-onetake-media}

  migrate:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://onetake:onetake_dev_password@postgres:5432/onetake}
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic -c alembic.ini upgrade head
    volumes:
      - ./apps/api/alembic.ini:/app/alembic.ini
      - ./apps/api/migrations:/app/migrations
      - ./apps/api/src:/app/src

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://onetake:onetake_dev_password@postgres:5432/onetake}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onetake}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-onetake_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-onetake-media}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MOCK_PROVIDERS: ${MOCK_PROVIDERS:-true}
      PROJECT_TTL_HOURS: ${PROJECT_TTL_HOURS:-24}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: uvicorn onetake_api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api/alembic.ini:/app/alembic.ini
      - ./apps/api/migrations:/app/migrations
      - ./apps/api/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./apps/worker
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://onetake:onetake_dev_password@postgres:5432/onetake}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MOCK_PROVIDERS: ${MOCK_PROVIDERS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m onetake_worker.main
    volumes:
      - ./apps/worker/src:/app/src

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/index.html:/app/index.html
      - ./apps/web/vite.config.ts:/app/vite.config.ts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data: