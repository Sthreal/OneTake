name: 功能建议
description: 建议新能力、流程优化或界面改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述真实使用场景和期望结果，而不只是“增加一个功能”。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 当前流程哪里不方便、成本高或容易出错？
      placeholder: 例如：我希望批量生成多个商品视频，但当前只能逐个创建项目。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望 One Take 如何使用或呈现这个能力？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你尝试过的替代方案
      description: 现在你是怎么绕过这个问题的？
    validations:
      required: false
  - type: dropdown
    id: value
    attributes:
      label: 主要价值
      multiple: true
      options:
        - 提高生成质量
        - 降低操作成本
        - 降低生成费用
        - 提升生成速度
        - 改善部署和维护
        - 改善界面体验
        - 增加商业模式或分发能力
        - 其他
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 希望尽快支持
        - 有更好，没有也可以
        - 长期建议
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 你认为怎样算完成
      description: 请给出可验证的验收标准。
      placeholder: |
        - 可以一次选择多个商品
        - 每个商品独立记录生成状态
        - 失败项目可以单独重试
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，尽量确认这不是重复建议。
          required: true
        - label: 我没有提交 `.env`、API Key、Cookie、Token 或用户隐私数据。
          required: true