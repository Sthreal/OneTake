[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onetake-api"
version = "0.1.0"
description = "One Take API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
  "rq>=2.1,<3",
  "minio>=7.2,<8",
  "Pillow>=11,<13",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "alibabacloud_imageseg20191230>=4.0.1,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
