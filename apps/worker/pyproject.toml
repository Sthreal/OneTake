[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onetake-worker"
version = "0.1.0"
description = "One Take worker"
requires-python = ">=3.11"
dependencies = [
  "redis>=5.2,<6",
  "psycopg[binary]>=3.2,<4",
  "rq>=2.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]